# Goal-image groups for the linear goal head (docs/linear_head_plan.md, step 1).
seed: 0
warmup_steps: 40   # same target construction as configs/baseline.yaml
goal_steps: 30
first_seed:        # disjoint target seed ranges; test = baseline evaluation seeds
  train: 100000
  val: 200000
  test: 60000
num_targets:       # train pool covers every allocation (M up to 512)
  train: 512
  val: 64
  test: 100
hands_per_target:  # train pool covers K up to 8
  train: 8
  val: 8
  test: 8
hand_bank:
  size: 64
  fractions: {train: 0.5, val: 0.25, test: 0.25}
  # Hand xy box in metres (Push puck starts near x in [-0.1, 0.1], y in [0.6, 0.7]
  # and is pushed toward y in [0.8, 0.9]). Check a few photos to confirm the
  # whole box is reachable and visible in the corner2 camera.
  low: [-0.25, 0.45]
  high: [0.25, 0.95]
min_hand_puck_distance: 0.06  # metres in xy, as in prepare_task
max_reach_error: 0.02         # metres in xy between the bank point and the reached hand
